name: Build Max APK

on:
  push:
    branches: [main]
    paths:
      - 'Max-*.zip'
      - '.github/workflows/build-max-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract packaged project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -1 Max-*.zip | sort -V | tail -n1)
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Verify Supabase and Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "Gradle project: $PWD"
          echo "Supabase references:"
          grep -RIl --exclude-dir=.gradle --exclude-dir=build -E 'SUPABASE_(URL|ANON_KEY|PUBLISHABLE_KEY)|supabaseUrl|supabaseKey' . | head -n 30 || true
          if [ -f local.properties ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('local.properties')
          text=p.read_text(errors='ignore')
          for name in ['SUPABASE_URL','SUPABASE_ANON_KEY','SUPABASE_PUBLISHABLE_KEY','supabase.url','supabase.anonKey','supabase.publishableKey']:
              vals=[line.split('=',1)[1].strip() for line in text.splitlines() if line.strip().startswith(name+'=') and '=' in line]
              print(f'{name}:', 'SET' if vals and vals[-1] else 'MISSING')
          PY
          else
            echo "local.properties: MISSING"
          fi
          GS=$(find . -type f -name google-services.json | head -n1 || true)
          if [ -n "$GS" ]; then
            echo "google-services.json: PRESENT at $GS"
            python3 - "$GS" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          pkgs=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          print('Firebase packages:', ', '.join(x for x in pkgs if x))
          PY
          else
            echo "google-services.json: MISSING"
          fi
          grep -RhoE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' . --include='*.gradle' --include='*.gradle.kts' | head -n 10 || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-out
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk-out/max-debug.apk \;
          test -s apk-out/max-debug.apk
          sha256sum apk-out/max-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-debug-apk
          path: apk-out/max-debug.apk
          if-no-files-found: error
          retention-days: 7
