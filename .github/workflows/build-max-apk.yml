name: Build Max APK

on:
  push:
    branches: [main]
    paths:
      - 'Max-*.zip'
      - '.github/workflows/build-max-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract packaged project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -1 Max-*.zip | sort -V | tail -n1)
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Configure Supabase and Firebase
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > local.properties <<'EOF'
          SUPABASE_URL=https://madkfvggyolmdberzmtb.supabase.co
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S
          SUPABASE_ANON_KEY=sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'defaultConfig {'
          if marker not in s:
              raise SystemExit('defaultConfig block not found')
          fields = '''
                  buildConfigField("String", "SUPABASE_URL", "\\\"https://madkfvggyolmdberzmtb.supabase.co\\\"")
                  buildConfigField("String", "SUPABASE_PUBLISHABLE_KEY", "\\\"sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S\\\"")
                  buildConfigField("String", "SUPABASE_ANON_KEY", "\\\"sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S\\\"")
          '''
          if 'buildConfigField("String", "SUPABASE_URL"' not in s:
              s = s.replace(marker, marker + fields, 1)
              p.write_text(s)
          PY

          if [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "google-services.json missing" >&2
            exit 1
          fi

      - name: Verify client configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          text=Path('local.properties').read_text(errors='ignore')
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_ANON_KEY']:
              vals=[line.split('=',1)[1].strip() for line in text.splitlines() if line.strip().startswith(name+'=') and '=' in line]
              print(f'{name}:', 'SET' if vals and vals[-1] else 'MISSING')
              if not vals or not vals[-1]: raise SystemExit(1)
          gradle=Path('app/build.gradle.kts').read_text(errors='ignore')
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_ANON_KEY']:
              if name not in gradle: raise SystemExit(f'{name} BuildConfig field missing')
          print('Supabase BuildConfig fields: SET')
          PY

          test -s app/google-services.json
          APP_ID=$(grep -RhoE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' app --include='*.gradle' --include='*.gradle.kts' | head -n1 | sed -E 's/.*"([^"]+)"/\1/')
          python3 - "$APP_ID" <<'PY'
          import json,sys
          from pathlib import Path
          app_id=sys.argv[1]
          data=json.loads(Path('app/google-services.json').read_text())
          pkgs=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          print('Firebase file: PRESENT')
          print('Application ID:', app_id)
          print('Firebase package match:', 'MATCH' if app_id in pkgs else 'MISMATCH')
          print('Firebase registered packages:', ', '.join(x for x in pkgs if x))
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          GEN=$(find app/build/generated -type f -name BuildConfig.java -o -name BuildConfig.kt 2>/dev/null | head -n1 || true)
          if [ -n "$GEN" ]; then
            grep -q 'SUPABASE_URL' "$GEN"
            grep -q 'SUPABASE_PUBLISHABLE_KEY' "$GEN"
            echo "Generated BuildConfig Supabase fields: VERIFIED"
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-out
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk-out/max-debug.apk \;
          test -s apk-out/max-debug.apk
          sha256sum apk-out/max-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-debug-apk
          path: apk-out/max-debug.apk
          if-no-files-found: error
          retention-days: 7
